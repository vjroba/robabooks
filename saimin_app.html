<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SAIMIN</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  background: #000;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Georgia, 'Times New Roman', serif;
}
.saimin-frame {
  width: 100vw;
  max-width: 420px;
  height: 100vh;
  max-height: 920px;
  position: relative;
  overflow: hidden;
  background: #050106;
  color: #f5d9ec;
  user-select: none;
  isolation: isolate;
  contain: layout style;
}
@media (min-width: 500px) {
  .saimin-frame {
    border-radius: 36px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 8px #1a1a1a, 0 0 0 9px #333;
    aspect-ratio: 9 / 19;
    width: auto;
    height: 90vh;
  }
}

/* 渦レイヤー: 3枚のSVGをそれぞれCSSアニメーションで回転
   SVG要素ごと回転させることでブラウザがGPUコンポジットレイヤーを確保できる */
.vortex-layer {
  position: absolute;
  inset: -10%;
  width: 120%;
  height: 120%;
  z-index: 0;
  pointer-events: none;
  will-change: transform;
  transform-origin: center;
}
@keyframes spin     { to { transform: rotate( 360deg); } }
@keyframes spin-rev { to { transform: rotate(-360deg); } }
/* アイドル速度 (OFF時) */
#layer-back  { animation: spin-rev 600s linear infinite; }
#layer-mid   { animation: spin     300s linear infinite; }
#layer-front { animation: spin     167s linear infinite; }
/* アクティブ速度 (ON時) */
#layer-back.active  { animation-duration:  120s; }
#layer-mid.active   { animation-duration:   60s; }
#layer-front.active { animation-duration:   33s; }

.swirl-vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, #00000055 85%, #00000099 100%);
  z-index: 1; pointer-events: none;
}
.content {
  position: relative; z-index: 2;
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 3% 4% 3%;
}
.title {
  text-align: center;
  font-size: clamp(52px, 15vw, 72px);
  font-weight: 400;
  letter-spacing: 0.06em;
  color: #fff;
  text-shadow: 0 0 6px #ff7adf, 0 0 14px #d850b8, 0 0 28px #8a1a6a;
  margin: 0.5% 0 0;
}
.eye-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  margin: 1.5% 0;
  position: relative;
}
/* drop-shadow フィルターの代わりにCSSグラデーションで背景グロー
   filter: drop-shadow はSVGを毎フレーム再ラスタライズするためモバイルで重い */
.eye-glow {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 72%;
  max-width: 290px;
  aspect-ratio: 1;
  background: radial-gradient(ellipse at center, #ff7adf33 0%, #d850b81a 45%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.eye-svg {
  width: 100%;
  max-width: 400px;
  height: auto;
  position: relative;
}
.outer-rune-ring {
  animation: outer-rune-spin 40s linear infinite;
  transform-origin: 200px 200px;
  will-change: transform;
}
.outer-rune-ring.active { animation-duration: 9s; }
.inner-rune-ring {
  animation: inner-rune-spin 26s linear infinite;
  transform-origin: 200px 200px;
  will-change: transform;
}
.inner-rune-ring.active { animation-duration: 5s; }
@keyframes outer-rune-spin { to { transform: rotate(-360deg); } }
@keyframes inner-rune-spin { to { transform: rotate(360deg); } }
.iris-swirl {
  animation: iris-spin 18s linear infinite;
  transform-origin: 200px 200px;
  will-change: transform;
}
.iris-swirl.active { animation-duration: 3.5s; }
@keyframes iris-spin { to { transform: rotate(-360deg); } }
.toggle { display: flex; justify-content: center; gap: 6px; margin: 0.5% 0 1.5%; }
.toggle button {
  background: transparent;
  border: 1.5px solid #6e3056;
  border-radius: 14px;
  color: #c79bb5;
  font-family: Georgia, serif;
  font-size: 22px;
  padding: 6px 28px;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: all 0.25s ease;
}
.toggle button.active {
  border-color: #ff7adf;
  color: #fff;
  box-shadow: 0 0 12px #ff7adf, inset 0 0 10px #ff7adf55;
  text-shadow: 0 0 8px #ff7adf;
}
.stats {
  font-family: 'Courier New', monospace;
  font-size: 13px;
  margin: 1.5% 0;
  display: grid;
  grid-template-columns: 1fr 90px;
  gap: 4px 8px;
  align-items: center;
}
.stat-line { letter-spacing: 0.04em; color: #e0c0d8; }
.stat-value { color: #ff9ee0; font-weight: bold; transition: color 0.3s; }
.battery {
  width: 24px; height: 12px; border: 1.5px solid #c79bb5; border-radius: 2px;
  position: relative; justify-self: end; margin-right: 4px;
}
.battery::after { content:''; position:absolute; left:1px; top:1px; bottom:1px; right:4px; background:#c79bb5; }
.battery::before { content:''; position:absolute; right:-3px; top:3px; width:2px; height:4px; background:#c79bb5; }
.wave-canvas { width: 90px; height: 40px; align-self: center; grid-row: 2 / 4; grid-column: 2; }
.controls { display: flex; justify-content: space-between; gap: 5px; margin: 1% 0; }
.controls button {
  flex: 1; background: transparent;
  border: 1px solid #6e3056; border-radius: 6px;
  color: #d0a8c0;
  font-family: Helvetica, sans-serif;
  font-size: 11px;
  padding: 6px 2px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.2s;
}
.controls button:hover, .controls button.active {
  border-color: #ff7adf; color: #fff; box-shadow: 0 0 8px #ff7adf66;
}
.trance {
  text-align: center;
  font-size: 18px;
  letter-spacing: 0.32em;
  color: #d0a8c0;
  font-family: Helvetica, sans-serif;
  text-shadow: 0 0 6px #ff7adf88;
  margin-top: 0.5%;
}
.trance.active { animation: trance-pulse 2s ease-in-out infinite; }
@keyframes trance-pulse {
  0%, 100% { opacity: 0.7; text-shadow: 0 0 6px #ff7adf88; }
  50% { opacity: 1; text-shadow: 0 0 16px #ff7adf, 0 0 32px #ff7adfaa; color: #fff; }
}
</style>
</head>
<body>
<div class="saimin-frame" id="saimin">

  <!-- 後景: 背景グラデーション + 大きくぼかしたアーム。最も遅く逆回転 -->
  <svg id="layer-back" class="vortex-layer active" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="bgRad" cx="50%" cy="50%" r="70%">
        <stop offset="0%" stop-color="#2a0420"/>
        <stop offset="50%" stop-color="#180210"/>
        <stop offset="100%" stop-color="#050003"/>
      </radialGradient>
      <filter id="blurBack" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="22"/>
      </filter>
    </defs>
    <rect x="-500" y="-500" width="1000" height="1000" fill="url(#bgRad)"/>
    <g id="armsBack" filter="url(#blurBack)"></g>
  </svg>

  <!-- 中景: 中程度のぼかし。中速で順回転 -->
  <svg id="layer-mid" class="vortex-layer active" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="blurMid" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="10"/>
      </filter>
    </defs>
    <g id="armsMid" filter="url(#blurMid)"></g>
  </svg>

  <!-- 前景: 軽くぼかした細いアーム。最速で順回転 -->
  <svg id="layer-front" class="vortex-layer active" viewBox="-500 -500 1000 1000" preserveAspectRatio="xMidYMid slice">
    <defs>
      <filter id="blurFront" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="5"/>
      </filter>
    </defs>
    <g id="armsFront" filter="url(#blurFront)"></g>
  </svg>

  <div class="swirl-vignette"></div>

  <div class="content">
    <h1 class="title">SAIMIN</h1>
    <div class="eye-wrap">
      <div class="eye-glow"></div>
      <svg class="eye-svg" viewBox="0 0 400 400">
        <defs>
          <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0a0208"/>
            <stop offset="40%" stop-color="#3a0a26"/>
            <stop offset="100%" stop-color="#1a0414"/>
          </radialGradient>

          <!-- Eye almond shape: width 280 (x=60-340), height 112 at center (y=144-256, matches iris diameter) -->
          <path id="eyePath" d="M 60,200 Q 200,88 340,200 Q 200,312 60,200 Z"/>

          <clipPath id="eyeClip">
            <use href="#eyePath"/>
          </clipPath>

          <!-- Inner rune path: text at r=76, band from r=59 (iris edge) to r=93 (40% toward eye tip) -->
          <path id="innerRingPath" d="M 200,200 m -76,0 a 76,76 0 1,0 152,0 a 76,76 0 1,0 -152,0"/>

          <!-- Outer rune path: text at r=93, band from r=76 to r=110 (same width as inner, shifted out by half) -->
          <path id="outerRingPath" d="M 200,200 m -93,0 a 93,93 0 1,0 186,0 a 93,93 0 1,0 -186,0"/>
        </defs>

        <!-- ========== OUTSIDE-EYE LAYER ========== -->

        <!-- Spikes radiating from center (drawn behind, partially clipped by eye outline naturally) -->
        <g fill="#fff">
          <polygon points="200,28 208,158 200,148 192,158"/>
          <polygon points="200,372 208,242 200,252 192,242"/>
          <polygon points="28,200 158,208 148,200 158,192"/>
          <polygon points="372,200 242,208 252,200 242,192"/>
          <g transform="rotate(45 200 200)">
            <polygon points="200,72 205,158 200,150 195,158"/>
            <polygon points="200,328 205,242 200,250 195,242"/>
            <polygon points="72,200 158,205 150,200 158,195"/>
            <polygon points="328,200 242,205 250,200 242,195"/>
          </g>
        </g>

        <!-- OUTER RUNE RING: visible at spikes above/below eye. Band r=76–110, text at r=93 -->
        <g class="outer-rune-ring active" id="outerRing">
          <circle cx="200" cy="200" r="93" fill="none" stroke="#fff" stroke-width="1" opacity="0.4"/>
          <text fill="#fff" font-size="18" font-family="serif" opacity="0.92">
            <textPath href="#outerRingPath" startOffset="0" textLength="584.3" lengthAdjust="spacing">ᚦⵎᚱⵙᛗⵏᛞᚺⵄᚷᛒⵜᛚᛁⵙᛏⵄᚷⵎᚱᛗᚺᛒⵜⵄᛜᛞⵙᚦᛗᚱ</textPath>
          </text>
        </g>

        <!-- Eye outline: black fill hides the portion of the outer ring that falls inside the eye boundary -->
        <use href="#eyePath" fill="#0a0208" stroke="#fff" stroke-width="7"/>

        <!-- ========== INSIDE-EYE LAYER (clipped) ========== -->
        <g clip-path="url(#eyeClip)">
          <!-- Iris fill -->
          <circle cx="200" cy="200" r="56" fill="url(#irisGrad)"/>

          <!-- Spinning spiral inside iris -->
          <g class="iris-swirl active" id="iswirl">
            <path id="spiralPath" stroke="#fff" stroke-width="1.8" fill="none" opacity="0.95" stroke-linecap="round"/>
            <path id="spiralPath2" stroke="#ff9ee0" stroke-width="1.2" fill="none" opacity="0.7" stroke-linecap="round"/>
          </g>

          <!-- Iris stroke (on top of spiral) -->
          <circle cx="200" cy="200" r="56" fill="none" stroke="#fff" stroke-width="4"/>

          <!-- INNER RUNE RING: inside eye clip, band r=59–93, text at r=76 -->
          <g class="inner-rune-ring active" id="innerRing">
            <text fill="#fff" font-size="20" font-family="serif" opacity="0.9">
              <textPath href="#innerRingPath" startOffset="0" textLength="477.5" lengthAdjust="spacing">ᚦⵎᚱⵉᛗⵏᛞᚺⵄᚷᛒⵜᛚⵙᛏᚹᛜᛟᛢᚦⵎⵏᚱᛗ</textPath>
            </text>
          </g>

          <!-- Central pupil dot -->
          <circle cx="200" cy="200" r="6" fill="#0a0208"/>
        </g>
      </svg>
    </div>
    <div class="toggle">
      <button id="btnOff">OFF</button>
      <button id="btnOn" class="active">ON</button>
    </div>
    <div class="stats">
      <div class="stat-line">RELAXATION LEVEL: <span class="stat-value" id="sRelax">85%</span></div>
      <div class="battery"></div>
      <div class="stat-line">BREATHING DEPTH: <span class="stat-value" id="sBreath">DEEP</span></div>
      <div class="stat-line">FREQUENCY: <span class="stat-value" id="sFreq">7.8 Hz</span> (<span class="stat-value" id="sBand">ALPHA</span>)</div>
      <canvas class="wave-canvas" id="wave" width="180" height="80"></canvas>
    </div>
    <div class="controls">
      <button id="cAdjust">ADJUST</button>
      <button id="cTimer">TIMER</button>
      <button id="cAudio">AUDIO MODE</button>
    </div>
    <div class="trance active" id="trance">TRANCE</div>
  </div>
</div>
<script>
(function() {
  const $ = (id) => document.getElementById(id);
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const isMobile = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;

  // ============ Background vortex arms ============
  function buildArmPath(phase, growth, startR, maxR, baseThickness, twist) {
    const outer = [];
    const inner = [];
    for (let t = 0; t < 8; t += 0.10) { // 0.05→0.10: パス頂点を半減
      const r = startR * Math.exp(growth * t);
      if (r > maxR) break;
      const angle = phase + t * twist;
      const w = baseThickness * (0.4 + r / maxR * 1.6);
      const px = Math.cos(angle + Math.PI/2);
      const py = Math.sin(angle + Math.PI/2);
      const cx = r * Math.cos(angle);
      const cy = r * Math.sin(angle);
      outer.push([cx + w * px, cy + w * py]);
      inner.push([cx - w * px, cy - w * py]);
    }
    if (outer.length < 2) return '';
    let d = 'M ' + outer[0][0].toFixed(1) + ',' + outer[0][1].toFixed(1);
    for (let i = 1; i < outer.length; i++) d += ' L ' + outer[i][0].toFixed(1) + ',' + outer[i][1].toFixed(1);
    for (let i = inner.length - 1; i >= 0; i--) d += ' L ' + inner[i][0].toFixed(1) + ',' + inner[i][1].toFixed(1);
    d += ' Z';
    return d;
  }
  function addArm(parent, phase, growth, startR, maxR, thickness, twist, color, opacity) {
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', buildArmPath(phase, growth, startR, maxR, thickness, twist));
    path.setAttribute('fill', color);
    path.setAttribute('opacity', opacity);
    parent.appendChild(path);
  }

  const back = $('armsBack');
  for (let i = 0; i < 3; i++) {
    addArm(back, i * Math.PI * 2 / 3, 0.50, 30, 800, 90, 1.5, '#4a0c30', 0.95);
  }
  const mid = $('armsMid');
  const midColors = ['#a02060', '#6e1248', '#bc2870', '#581038', '#8a1858'];
  for (let i = 0; i < 5; i++) {
    addArm(mid, i * Math.PI * 2 / 5, 0.46, 25, 700, 32, 1.6, midColors[i], 0.95);
  }
  const front = $('armsFront');
  for (let i = 0; i < 5; i++) { // 7→5本に削減
    addArm(front, i * Math.PI * 2 / 5 + 0.4, 0.44, 20, 600, 10, 1.85, '#d03888', 0.65);
  }

  // ============ Iris spiral ============
  function buildSpiral(id, turns, step, dir) {
    let d = '';
    let first = true;
    for (let t = 0; t < turns * Math.PI; t += 0.12) {
      const r = t * step;
      if (r > 52) break;
      const x = 200 + r * Math.cos(t * dir);
      const y = 200 + r * Math.sin(t * dir);
      d += (first ? 'M ' : ' L ') + x.toFixed(2) + ',' + y.toFixed(2);
      first = false;
    }
    $(id).setAttribute('d', d);
  }
  buildSpiral('spiralPath', 14, 1.2, 1);
  buildSpiral('spiralPath2', 14, 1.2, -1);

  // ============ App state and logic ============
  const state = { on: true, band: 'ALPHA', freq: 7.8, relax: 85, breath: 'DEEP', timer: null, timerId: null, audio: 'BINAURAL' };
  const bands = [
    { name: 'DELTA', range: [0.5, 4] },
    { name: 'THETA', range: [4, 8] },
    { name: 'ALPHA', range: [8, 13] },
    { name: 'BETA',  range: [13, 30] },
    { name: 'GAMMA', range: [30, 80] }
  ];
  const breathStates = ['SHALLOW', 'NORMAL', 'DEEP', 'VERY DEEP', 'SUSPENDED'];
  const audioModes = ['BINAURAL', 'ISOCHRONIC', 'DEEP DRONE', '432 Hz', 'SILENT'];

  function setActive(on) {
    state.on = on;
    $('btnOn').classList.toggle('active', on);
    $('btnOff').classList.toggle('active', !on);
    // 渦レイヤーのCSSアニメーション速度切り替え
    $('layer-back').classList.toggle('active', on);
    $('layer-mid').classList.toggle('active', on);
    $('layer-front').classList.toggle('active', on);
    // 眼球要素
    $('outerRing').classList.toggle('active', on);
    $('innerRing').classList.toggle('active', on);
    $('iswirl').classList.toggle('active', on);
    $('trance').classList.toggle('active', on);
    if (!on) {
      $('sRelax').textContent = '--';
      $('sBreath').textContent = 'IDLE';
      $('sFreq').textContent = '0.0 Hz';
      $('sBand').textContent = '----';
    } else { render(); }
  }
  function rand(a, b) { return Math.random() * (b - a) + a; }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function render() {
    $('sRelax').textContent = Math.round(state.relax) + '%';
    $('sBreath').textContent = state.breath;
    $('sFreq').textContent = state.freq.toFixed(1) + ' Hz';
    $('sBand').textContent = state.band;
  }
  render();

  let tickCount = 0;
  setInterval(() => {
    if (!state.on) return;
    tickCount++;
    state.relax += (92 - state.relax) * 0.1 + rand(-2.5, 2.5);
    state.relax = Math.max(72, Math.min(99, state.relax));
    const band = bands.find(b => b.name === state.band);
    if (band) {
      state.freq += rand(-0.4, 0.4);
      state.freq = Math.max(band.range[0], Math.min(band.range[1], state.freq));
    }
    if (tickCount % 7 === 0) state.breath = pick(breathStates);
    render();
  }, 550);

  $('btnOn').onclick = () => setActive(true);
  $('btnOff').onclick = () => setActive(false);
  $('cAdjust').onclick = () => {
    const i = bands.findIndex(b => b.name === state.band);
    const next = bands[(i + 1) % bands.length];
    state.band = next.name;
    state.freq = (next.range[0] + next.range[1]) / 2;
    if (state.on) render();
  };
  $('cTimer').onclick = () => {
    if (state.timerId) {
      clearInterval(state.timerId);
      state.timerId = null;
      $('cTimer').textContent = 'TIMER';
      $('cTimer').classList.remove('active');
      return;
    }
    state.timer = 300;
    $('cTimer').classList.add('active');
    const fmt = () => {
      const m = Math.floor(state.timer / 60);
      const s = state.timer % 60;
      $('cTimer').textContent = m + ':' + String(s).padStart(2, '0');
    };
    fmt();
    state.timerId = setInterval(() => {
      state.timer--;
      fmt();
      if (state.timer <= 0) {
        clearInterval(state.timerId);
        state.timerId = null;
        $('cTimer').textContent = 'COMPLETE';
        setTimeout(() => {
          $('cTimer').textContent = 'TIMER';
          $('cTimer').classList.remove('active');
        }, 2500);
      }
    }, 1000);
  };
  $('cAudio').onclick = () => {
    const i = audioModes.indexOf(state.audio);
    state.audio = audioModes[(i + 1) % audioModes.length];
    $('cAudio').textContent = state.audio;
    $('cAudio').classList.add('active');
    setTimeout(() => $('cAudio').classList.remove('active'), 800);
  };

  // ============ Waveform canvas (JSで残る唯一のRAF処理) ============
  const cvs = $('wave');
  const wCtx = cvs.getContext('2d');
  const W = cvs.width, H = cvs.height;
  const waveStep = isMobile ? 2 : 1;
  let wavePhase = 0;
  // モバイルは30fps上限 (波形は30fpsで十分)
  const FRAME_MS = isMobile ? 1000 / 30 : 0;
  let lastWaveTime = 0;

  function drawWave(now) {
    requestAnimationFrame(drawWave);
    if (FRAME_MS > 0 && now - lastWaveTime < FRAME_MS - 1) return;
    lastWaveTime = now;

    wCtx.clearRect(0, 0, W, H);
    wCtx.strokeStyle = '#ff9ee0';
    wCtx.lineWidth = 1.4;
    wCtx.shadowBlur = isMobile ? 0 : 5;
    if (!isMobile) wCtx.shadowColor = '#ff7adf';
    wCtx.beginPath();
    const speed = state.on ? state.freq / 10 + 0.08 : 0.015;
    const amp = state.on ? H * 0.42 : H * 0.04;
    for (let x = 0; x < W; x += waveStep) {
      const y = H / 2
        + Math.sin(x * 0.12 + wavePhase) * amp * 0.55
        + Math.sin(x * 0.045 + wavePhase * 1.4) * amp * 0.3
        + Math.sin(x * 0.22 + wavePhase * 0.6) * amp * 0.18;
      if (x === 0) wCtx.moveTo(x, y); else wCtx.lineTo(x, y);
    }
    wCtx.stroke();
    wavePhase += speed;
  }
  requestAnimationFrame(drawWave);
})();
</script>
</body>
</html>
